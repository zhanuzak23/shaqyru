<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3E9DC">
<meta name="robots" content="noindex, nofollow">
<title>Мейіржан &amp; Тоғжан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&amp;family=Manrope:wght@300;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F3E9DC;
  --ground-top:#EFDFC9;
  --ink:#43151F;
  --ink-soft:#7A5A4E;
  --wine:#6E2436;
  --bronze:#7C5A20;
  --card:#FCF8F1;
  --serif:"Playfair Display","Noto Serif",Georgia,serif;
  --sans:"Manrope","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;
  background:radial-gradient(120% 80% at 50% 36%,var(--card),var(--ground-top) 78%);
  color:var(--ink);font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;
}
.wrap{display:grid;justify-items:center;gap:22px;max-width:34ch}
.oyu{width:clamp(120px,32vw,150px);height:auto}
.eyebrow{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--bronze);font-weight:500}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,6.4vw,30px);letter-spacing:.06em;line-height:1.4}
p{font-size:15px;line-height:1.85;color:var(--ink-soft)}
a{
  margin-top:6px;padding:16px 36px;border:1px solid var(--wine);border-radius:100px;
  color:var(--wine);text-decoration:none;
  font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;
  transition:background .4s ease,color .4s ease;
}
a:hover,a:focus-visible{background:var(--wine);color:var(--card)}
</style>
</head>
<body>
  <div class="wrap">
    <img class="oyu" src="/oyu.svg" alt="">
    <p class="eyebrow">Мейіржан &amp; Тоғжан</p>
    <h1>Бұл бет табылмады</h1>
    <p>Сілтеме дұрыс емес сияқты. Шақыруды төмендегі түйме арқылы ашыңыз.</p>
    <a href="/">Шақыруды ашу</a>
  </div>
</body>
</html>
